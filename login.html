<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sahyog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVIGATION ================= -->

    <nav>

        <div class="logo">
            ❤️ Sahyog
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- ================= LOGIN FORM ================= -->

    <section class="form-section">

        <div class="form-container">

            <h1>Welcome Back</h1>

            <p class="form-subtitle">
                Login to your Sahyog account
            </p>


            <form id="loginForm">

                <!-- Email -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small class="error" id="loginEmailError"></small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                        minlength="6"
                    >

                    <small class="error" id="loginPasswordError"></small>

                </div>


                <!-- Remember me -->

                <div class="remember">

                    <input type="checkbox" id="remember">

                    <label for="remember">
                        Remember me
                    </label>

                </div>


                <!-- Login button -->

                <button type="submit" class="form-btn">
                    Login
                </button>


                <!-- Register link -->

                <p class="form-footer">

                    Don't have an account?

                    <a href="register.html">
                        Register here
                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Sahyog - Smart Food Donation & NGO Management System
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
