<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Sahyog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <div class="logo">
            ❤️ Sahyog
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>

    </nav>

    <section class="form-section">

        <div class="form-container">

            <h1>Create Account</h1>

            <p class="form-subtitle">
                Join Sahyog and help reduce food waste
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label>
                        Account Type
                    </label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="role"
                                value="donor"
                                required
                            >
                            Donor
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="role"
                                value="ngo"
                            >
                            NGO
                        </label>

                    </div>

                    <small class="error" id="roleError"></small>

                </div>

                <div class="form-group">

                    <label for="name">
                        Full Name / Organization Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                        minlength="3"
                    >

                    <small class="error" id="nameError"></small>

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small class="error" id="emailError"></small>

                </div>

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        required
                    >

                    <small class="error" id="phoneError"></small>

                </div>

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                        rows="4"
                        required
                    ></textarea>

                    <small class="error" id="addressError"></small>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                    <small class="error" id="passwordError"></small>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                    >

                    <small class="error" id="confirmPasswordError"></small>

                </div>

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the terms and conditions.

                    </label>

                </div>

                <button
                    type="submit"
                    class="form-btn"
                >
                    Create Account
                </button>

                <p class="form-footer">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </form>

        </div>

    </section>

    <footer>

        <p>
            © 2026 Sahyog - Smart Food Donation & NGO Management System
        </p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
